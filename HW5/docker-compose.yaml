services:
#this will need to change when I create the apps
  temp:
    build:
      context: ./Temp
      dockerfile: Dockerfile
    expose:
      - "5005"
  wind:
    build:
      context: ./Wind
      dockerfile: Dockerfile
    expose:
      - "5005"
  humidity:
    build: 
      context: ./Humidity
      dockerfile: Dockerfile
    expose:
      - "5005"
  weatherman:
    build:
      context: ./Weatherman
      dockerfile: Dockerfile
    expose:
      - "5005"
  nginx:
    image: nginx:latest
    ports:
      - "80:80"  # Bind host port 80 to container port 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Mount Nginx config
