services:
  flasker:
    build: .
    expose:
      - "5021"
    deploy:
      replicas: 2

  nginx:
    image: nginx:latest
    ports:
      - "80:80"  # Bind host port 80 to container port 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Mount Nginx config
  redis:
    image: "redis"
    ports:
      - "6379:6379"
