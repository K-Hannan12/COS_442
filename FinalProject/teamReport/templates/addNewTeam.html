<!DOCTYPE html>
<html>
    <head>
        <title>Add New Team</title>
    </head>
    <body>
        <h1>Add New Team</h1>
        <form method="POST" action="/addNewTeamComplete">
            <label for="teamName">Team Name:</label><br>
            <input type="text" id="teamName" name="teamName"><br><br>
            
            <label for="founding_year">Year Founded:</label><br>
            <input type="text" id="founding_year" name="founding_year"><br><br>
            
            <label for="location">Location:</label><br>
            <input type="text" id="location" name="location"><br><br>
            
            <label for="abbreviation">Abbreviation:</label><br>
            <input type="text" id="abbreviation" name="abbreviation"><br><br>
            
            <label for="nickname">Nickname:</label><br>
            <input type="text" id="nickname" name="nickname"><br><br>
            
            <label for="league">League:</label><br>
            <input type="text" id="league" name="league"><br><br>
            
            <label for="division">Division:</label><br>
            <input type="text" id="division" name="division"><br><br>
            
            <label for="stadium">Stadium:</label><br>
            <input type="text" id="stadium" name="stadium"><br><br>
            
            <label for="all_time_wins">All Time Wins:</label><br>
            <input type="number" id="all_time_wins" name="all_time_wins"><br><br>
            
            <label for="all_time_losses">All Time Losses:</label><br>
            <input type="number" id="all_time_losses" name="all_time_losses"><br><br>
            
            <label for="division_titles">Division Titles:</label><br>
            <input type="number" id="division_titles" name="division_titles"><br><br>

            <label for="world_series_titles">World Series Titles:</label><br>
            <input type="number" id="world_series_titles" name="world_series_titles"><br><br>

            <label for="last_world_series_won">Last World Series Won:</label><br>
            <input type="text" id="last_world_series_won" name="last_world_series_won"><br><br>

            <input type="submit" value="Add Team">
        </form>
    </body>
</html>
