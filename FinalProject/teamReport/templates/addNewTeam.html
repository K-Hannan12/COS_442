<!DOCTYPE html>
<html>
    <head>
        <title>Add New Team</title>
    </head>
    <body>
        <h1>Add New Team</h1>
        <form method="POST" action="/addNewTeamComplete">
            <label for="teamName"><b>Team Name</b>:</label><br>
            <input type="text" id="teamName" name="teamName"required><br><br>
            
            <label for="founding_year"><b>Year Founded</b>:</label><br>
            <input type="text" id="founding_year" name="founding_year"required><br><br>
            
            <label for="location"><b>Location</b></label><br>
            <input type="text" id="location" name="location"required><br><br>
            
            <label for="abbreviation"><b>Abbreviation</b></label><br>
            <input type="text" id="abbreviation" name="abbreviation"required><br><br>
            
            <label for="nickname"><b>Nickname</b></label><br>
            <input type="text" id="nickname" name="nickname"required><br><br>
            
            <label for="league"><b>League</b></label><br>
            <select id="league" name="league">
                <option value="American">American</option>
                <option value="National">National</option>
            </select><br><br>
            
            <label for="division"><b>Division</b></label><br>
            <select id="division" name="division">
                <option value="AL East">AL East</option>
                <option value="AL Central">AL Central</option>
                <option value="AL West">AL West</option>
                <option value="NL East">NL East</option>
                <option value="NL Central">NL Central</option>
                <option value="NL West">NL West</option>
            <select><br><br>
            
            <label for="stadium"><b>Stadium</b></label><br>
            <input type="text" id="stadium" name="stadium"required><br><br>
            
            <label for="all_time_wins"><b>All Time Wins</b></label><br>
            <input type="text" id="all_time_wins" name="all_time_wins"required><br><br>
            
            <label for="all_time_losses"><b>All Time Losses</b></label><br>
            <input type="text" id="all_time_losses" name="all_time_losses"required><br><br>
            
            <label for="division_titles"><b>Division Titles</b></label><br>
            <input type="text" id="division_titles" name="division_titles"required><br><br>

            <label for="world_series_titles"><b>World Series Titles</b></label><br>
            <input type="text" id="world_series_titles" name="world_series_titles"required><br><br>

            <label for="last_world_series_won"><b>Last World Series Won</b></label><br>
            <input type="text" id="last_world_series_won" name="last_world_series_won"required><br><br>

            <input type="submit" value="Add Team">
        </form>
    </body>
</html>
