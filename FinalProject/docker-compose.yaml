services:
#this will need to change when I create the apps
  player-report:
    build:
      context: ./playerReport
      dockerfile: Dockerfile
    expose:
      - "5005"
  player-bio:
    build:
      context: ./playerBio
      dockerfile: Dockerfile
    expose:
      - "5005"
  player-batting:
    build:
      context: ./playerBatting
      dockerfile: Dockerfile
    expose:
      - "5005"
  player-fielding-pitching:
    build:
      context: ./playerFieldingPitching
      dockerfile: Dockerfile
    expose:
      - "5005"
  team-report:
    build:
      context: ./teamReport
      dockerfile: DockerFile
    expose:
      - "5005"
  team-info:
    build:
      context: ./teamInfo
      dockerfile: DockerFile
    expose:
      - "5005"
  nginx:
    image: nginx:latest
    ports:
      - "80:80"  # Bind host port 80 to container port 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Mount Nginx config
  redis:
    image: "redis"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
    redis_data:
      
