<!DOCTYPE html>
<html>
<head>
    <title>Add New Player Fielding and Pitching</title>
    <style>
    </style>
</head>
<body>
    <h1>Fielding and Pitching Stats for {{playerName}}</h1>
    <form method="post" action="http://player-fielding:5005/storeplayerFieldingPitching">
    <input type="hidden" name="playerName" id="playerName" value="{{ playerName }}">
    
    <label for="gamesPlayed"><b>Games Played</b>:</label><br>
    <input type="text" name="gamesPlayed" id="gamesPlayed"required><br>
    
    <label for="gamesStarted"><b>Games Started</b>:</label><br>
    <input type="text" name="gamesStarted" id="gamesStarted"required><br>
    
    <label for="inningsAtPosition"><b>Innings At Position</b>:</label><br>
    <input type="text" name="inningsAtPosition" id="inningsAtPosition"required><br>
    
    <label for="putOuts"><b>Put Outs</b>:</label><br>
    <input type="text" name="putOuts" id="putOuts"required><br>
    
    <label for="assists"><b>Assists</b>:</label><br>
    <input type="text" name="assists" id="assists"required><br>
    
    <label for="errors"><b>Errors</b>:</label><br>
    <input type="text" name="errors" id="errors"required><br>
    
    <label for="doublePlays"><b>Double Plays</b>:</label><br>
    <input type="text" name="doublePlays" id="doublePlays"required><br>
    
    <label for="fieldingPercentage"><b>Fielding Percentage</b>:</label><br>
    <input type="text" name="fieldingPercentage" id="fieldingPercentage"required><br>
    
    <label for="wins"><b>Wins</b>:</label><br>
    <input type="text" name="wins" id="wins"required><br>
    
    <label for="losses"><b>Losses</b>:</label><br>
    <input type="text" name="losses" id="losses"required><br>
    
    <label for="earnedRunAverage"><b>Earned Run Average</b>:</label><br>
    <input type="text" name="earnedRunAverage" id="earnedRunAverage"required><br>
    
    <label for="saves"><b>Saves</b>:</label><br>
    <input type="text" name="saves" id="saves"required><br>
    
    <label for="strikeOutsPitching"><b>Strike Outs</b>:</label><br>
    <input type="text" name="strikeOutsPitching" id="strikeOutsPitching"required><br>
    
    <label for="walksAllowed"><b>Walks Allowed</b>:</label><br>
    <input type="text" name="walksAllowed" id="walksAllowed"required><br>
    
    <label for="hitsAllowed"><b>Hits Allowed</b>:</label><br>
    <input type="text" name="hitsAllowed" id="hitsAllowed"required><br>
    
    <input type="submit" value="Submit">
    </form>
    </body>
</html>
